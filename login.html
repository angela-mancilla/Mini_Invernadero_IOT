<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Mini Invernadero IoT</title>
  <!-- Archivos públicos: el ESP32 debe entregarlos SIN sesión -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="pagina-login" data-page="login">

  <main class="login">
    <h1>Mini Invernadero IoT</h1>
    <p class="sub">Inicia sesión para ver y controlar el invernadero.</p>

    <!-- El envío lo maneja script.js (POST /api/login). No se usa GET para no exponer la clave en la URL. -->
    <form id="formLogin">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" maxlength="32" required autofocus>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required>

      <button id="btnLogin" type="submit">Iniciar sesión</button>
      <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script src="/script.js"></script>
</body>
</html>
